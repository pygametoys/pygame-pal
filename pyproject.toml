[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-pal"
version = "0.1.0"
description = "A pygame-based reimplementation of Chinese Paladin"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "attrs>=26.1.0",
    "charset-normalizer>=3.4.7",
    "configobj>=5.0.9",
    "construct>=2.10.70",
    "freesimplegui>=5.2.0.post1",
    "mido>=1.3.3",
    "numpy",
    "pygame-ce>=2.5.7",
    "pyopl>=2.0",
    "sounddevice>=0.5.5",
    "standard-sndhdr>=3.13.0 ; python_full_version >= '3.13'",
    "wcwidth>=0.7.0",
]

[project.optional-dependencies]
console = [
    "ptpython",
]
decompress = [
    "cython",
]
midi = [
    "supriya-midi",
]
video = [
    "decord; sys_platform == 'win32'",
    "decord2; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.0",
]

[project.scripts]
pygame-pal = "pgpal.__main__:main"
pygame-pal-config = "pgpal.configpage.__main__:main"

[tool.setuptools.packages.find]
include = ["pgpal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
